version: '3.8'
services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build: ./server
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/mlstudio
      - REDIS_URL=redis://redis:6379
      - FASTAPI_URL=http://ml-engine:8000
    env_file:
      - ./server/.env
    depends_on:
      - mongo
      - redis

  ml-engine:
    build: ./ml-engine
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server

volumes:
  mongo-data:
