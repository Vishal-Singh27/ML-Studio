services:
  # 1. Python ML Engine (FastAPI)
  - type: web
    name: ml-studio-engine
    env: python
    buildCommand: "cd ml-engine && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd ml-engine && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11

  # 2. Node Backend (Express + BullMQ)
  - type: web
    name: ml-studio-server
    env: node
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npx tsx src/app.ts"
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: ML_ENGINE_URL
        fromService:
          type: web
          name: ml-studio-engine
          envVarKey: RENDER_EXTERNAL_URL
      - key: GROQ_API_KEY
        sync: false # You will paste this in the Render Dashboard
      - key: REDIS_URL
        sync: false # You will paste your Upstash URL in the Render Dashboard

  # 3. React Frontend (Vite Static Site)
  - type: web
    name: ml-studio-client
    env: static
    buildCommand: "cd client && npm install"
    staticPublishPath: "./client/dist"
    envVars:
      - key: NODE_VERSION
        value: 20.x
    routes:
      # Proxy /api requests to the Node backend
      - type: rewrite
        source: /api/*
        destination: https://ml-studio-server.onrender.com/api/*
      # Single Page Application fallback
      - type: rewrite
        source: /*
        destination: /index.html
